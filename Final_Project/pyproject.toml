[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdd100k-road-detection-final-project"
version = "0.1.0"
description = "Real-time BDD100K road-object detection with YOLO and Faster R-CNN."
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "opencv-python>=4.9.0",
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0.0",
  "tqdm>=4.66.0",
  "matplotlib>=3.8.0",
  "jupyterlab>=4.0.0",
  "ipykernel>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
